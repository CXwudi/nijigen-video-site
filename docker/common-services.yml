# Reusable service definitions for local development, CI, and integration tests.
# compose.yml explicitly declares the services and top-level resources it uses.

services:
  postgres-base:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    volumes:
      - backend-dep-postgres-data:/var/lib/postgresql/data

  redis-base:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    volumes:
      - backend-dep-redis-data:/data

  flyway-base:
    image: flyway/flyway:11
    command: ["migrate"]
    depends_on:
      backend-dep-postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://backend-dep-postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      FLYWAY_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      FLYWAY_CONNECT_RETRIES: "60"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    restart: "no"
