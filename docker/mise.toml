[vars]
compose = "bash ./compose.sh"

[tasks.compose]
description = "Run arbitrary Docker Compose commands with the shared development configuration."
raw_args = true
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
{{ vars.compose }} "$@"
'''

[tasks.up-backend-deps]
description = "Start backend dependencies only: postgres, redis, and flyway."
run = '''
#!/usr/bin/env bash
set -euo pipefail
{{ vars.compose }} up -d
'''

[tasks.up-backend]
description = "Start backend dependencies and wait for the Gradle-backed API to be healthy."
run = '''
#!/usr/bin/env bash
set -euo pipefail
{{ vars.compose }} --profile backend up --wait --wait-timeout 600
'''

[tasks.up-frontend-deps]
description = "Start backend prerequisites for frontend development."
run = '''
#!/usr/bin/env bash
set -euo pipefail
{{ vars.compose }} --profile frontend-deps up -d
'''

[tasks.up-full]
description = "Start the full development stack."
run = '''
#!/usr/bin/env bash
set -euo pipefail
{{ vars.compose }} --profile full up -d
'''

[tasks.down]
description = "Stop the shared development stack while preserving named volumes and pnpm cache."
run = '''
#!/usr/bin/env bash
set -euo pipefail
{{ vars.compose }} --profile '*' down --remove-orphans
'''

[tasks.config]
description = "Print the resolved Compose configuration for all services."
run = '''
#!/usr/bin/env bash
set -euo pipefail
{{ vars.compose }} --profile '*' config
'''

[tasks.config-check]
description = "Validate each supported Compose profile and the complete configuration."
run = '''
#!/usr/bin/env bash
set -euo pipefail
export COMPOSE_PROFILES=
{{ vars.compose }} config --quiet
for profile in backend frontend-deps full '*'; do
  {{ vars.compose }} --profile "$profile" config --quiet
done
'''

[tasks.run]
description = "Run arbitrary commands in a Compose service; dependency services remain running."
raw_args = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
trap 'printf "\nShared services may still be running. Run: mise //docker:down when you are done.\n"' EXIT
{{ vars.compose }} run "$@"
'''

[tasks.clear-frontend-node-volumes]
description = "Reset disposable frontend dependency volumes while preserving postgres, redis, and pnpm cache."
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Named volumes survive container removal; resolve their project-specific names
# from Compose so cleanup also works after the frontend container is removed.
volume_names="$({{ vars.compose }} --profile full config --format json | node -e '
  const config = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
  for (const key of ["frontend-node-modules", "frontend-web-node-modules"]) {
    console.log(config.volumes[key].name);
  }
')"
{{ vars.compose }} --profile full rm --stop --force frontend-app-web
while IFS= read -r volume; do
  if docker volume inspect "$volume" > /dev/null 2>&1; then
    docker volume rm "$volume"
  fi
done <<< "$volume_names"
'''
