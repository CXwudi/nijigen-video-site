# Shared development stack. Profiles select services within the same project.

name: ${COMPOSE_PROJECT_NAME:-nijigen-video-site}

services:
  # ------------------------------------------------------- #
  #                         Backend                         #
  # ------------------------------------------------------- #

  backend-app-api:
    # The image needs to be align with the one used in gradle-base stage from the Dockerfile in backend/
    image: ghcr.io/bell-sw/liberica-native-image-kit-container:jdk-${JDK_VERSION:?JDK_VERSION must be provided, likely from mise.toml}-nik-${JDK_VERSION:?JDK_VERSION must be provided, likely from mise.toml}-glibc
    depends_on:
      backend-dep-postgres:
        condition: service_healthy
      backend-dep-redis:
        condition: service_healthy
      backend-dep-flyway:
        condition: service_completed_successfully
    working_dir: /workspace/backend
    user: "${HOST_UID:?HOST_UID must be provided}:${HOST_GID:?HOST_GID must be provided}"
    environment:
      SPRING_APPLICATION_NAME: ${COMPOSE_PROJECT_NAME:-nijigen-video-site}-${API_APPLICATION_NAME:-apps-api}
      SPRING_DATASOURCE_URL: jdbc:postgresql://backend-dep-postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: backend-dep-redis
      SPRING_DATA_REDIS_PORT: "6379"
      GRADLE_USER_HOME: /gradle-home
      JDK_VERSION: ${JDK_VERSION:?JDK_VERSION must be provided, likely from mise.toml}
      CI: ${CI:-}
    entrypoint: ["./gradlew", "--no-daemon"]
    command: [":apps:api:bootRun"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      # Cold Gradle downloads and compilation happen before Spring starts.
      start_period: 5m
    restart: "no"
    volumes:
      - ../backend:/workspace/backend
      - ${HOST_GRADLE_USER_HOME:-${GRADLE_USER_HOME:-${HOME}/.gradle}}:/gradle-home
    profiles:
      - backend
      - frontend-deps
      - full
    ports:
      - ${API_HTTP_PORT:-8080}:8080

  backend-dep-postgres:
    extends:
      file: common-services.yml
      service: postgres-base
    ports:
      - ${POSTGRES_HOST_PORT:-5432}:5432

  backend-dep-redis:
    extends:
      file: common-services.yml
      service: redis-base
    ports:
      - ${REDIS_HOST_PORT:-6379}:6379

  backend-dep-flyway:
    extends:
      file: common-services.yml
      service: flyway-base
    volumes:
      - ../infra/flyway/sql/baseline:/flyway/sql/baseline:ro
      - ../infra/flyway/sql/local:/flyway/sql/local:ro

  # ------------------------------------------------------- #
  #                        Frontend                         #
  # ------------------------------------------------------- #

  frontend-app-web:
    image: ghcr.io/pnpm/pnpm:${PNPM_VERSION:?PNPM_VERSION must be provided, likely from mise.toml}
    profiles:
      - full
    depends_on:
      backend-app-api:
        condition: service_healthy
    working_dir: /workspace/frontend
    # The entrypoint fixes volume ownership before switching to the host user.
    user: "0:0"
    environment:
      HOME: /tmp
      HOST_UID: ${HOST_UID:?HOST_UID must be provided}
      HOST_GID: ${HOST_GID:?HOST_GID must be provided}
      PNPM_CONFIG_STORE_DIR: /pnpm/store
      PNPM_CONFIG_CACHE_DIR: /pnpm/cache
      CI: ${CI:-}
    # Supply Node from pnpm's cache using the same version as the host mise setup.
    entrypoint:
      - sh
      - /docker/frontend-entrypoint.sh
      - --package=node@runtime:${NODE_VERSION:?NODE_VERSION must be provided, likely from mise.toml}
      - dlx
      - pnpm
    command: ["--filter", "web", "dev", "--host", "0.0.0.0"]
    restart: "no"
    ports:
      - ${FRONTEND_HTTP_PORT:-5173}:3000
    volumes:
      - ../frontend:/workspace/frontend
      - ./frontend-entrypoint.sh:/docker/frontend-entrypoint.sh:ro
      - ${HOST_PNPM_STORE_DIR:?Run through docker/compose.sh}:/pnpm/store
      - ${HOST_PNPM_CACHE_DIR:?Run through docker/compose.sh}:/pnpm/cache
      - frontend-node-modules:/workspace/frontend/node_modules
      - frontend-web-node-modules:/workspace/frontend/web/node_modules

volumes:
  backend-dep-postgres-data:
  backend-dep-redis-data:
  frontend-node-modules:
  frontend-web-node-modules:
