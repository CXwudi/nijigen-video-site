name: 'Frontend Check'

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

defaults:
  run:
    shell: 'bash'

jobs:
  check-frontend:
    name: 'Check Frontend'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 75
    permissions:
      contents: 'read'
    env:
      COMPOSE_PROJECT_NAME: 'nijigen-frontend-${{ github.run_id }}-${{ github.run_attempt }}'
      DOCKERHUB_USERNAME: '${{ secrets.DOCKERHUB_USERNAME }}'
      DOCKERHUB_TOKEN: '${{ secrets.DOCKERHUB_TOKEN }}'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install mise'
        uses: 'jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c' # v4.3.0
        with:
          experimental: true
          install: true
          cache: true

      - name: 'Set up Gradle cache'
        uses: 'gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6' # v6.4.0

      - name: 'Validate Docker Hub credentials'
        run: |
          if [[ -z "${DOCKERHUB_USERNAME}" && -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::notice::Docker Hub credentials are unavailable; skipping login."
            exit 0
          fi
          # A partial pair cannot authenticate and indicates a configuration error.
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured when either is set."
            exit 1
          fi

      - name: 'Login to Docker Hub'
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        uses: 'docker/login-action@dbcb813823bdd20940b903addbd779551569679f' # v4.6.0
        with:
          username: '${{ env.DOCKERHUB_USERNAME }}'
          password: '${{ env.DOCKERHUB_TOKEN }}'

      - name: 'Prepare Compose env file'
        run: 'cp docker/.env.example docker/.env'

      - name: 'Render frontend Compose stack'
        run: 'mise //docker:config-check'

      - name: 'Resolve frontend runtimes and pnpm cache paths'
        id: 'pnpm'
        run: |
          node_version="$(mise exec -- printenv NODE_VERSION)"
          pnpm_version="$(mise exec -- printenv PNPM_VERSION)"
          if [[ -z "${node_version}" || -z "${pnpm_version}" ]]; then
            echo '::error::NODE_VERSION and PNPM_VERSION must resolve through mise.'
            exit 1
          fi
          {
            echo "node_version=${node_version}"
            echo "pnpm_version=${pnpm_version}"
            echo "store_path=$(pnpm --dir frontend store path)"
            echo "cache_path=$(pnpm --dir frontend cache path)"
          } >> "${GITHUB_OUTPUT}"

      - name: 'Restore frontend pnpm cache'
        id: 'pnpm_cache'
        uses: 'actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
        with:
          path: |
            ${{ steps.pnpm.outputs.store_path }}
            ${{ steps.pnpm.outputs.cache_path }}
          key: "pnpm-cache-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.pnpm.outputs.node_version }}-pnpm-${{ steps.pnpm.outputs.pnpm_version }}-${{ hashFiles('frontend/pnpm-lock.yaml', 'frontend/pnpm-workspace.yaml') }}"
          restore-keys: |
            pnpm-cache-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.pnpm.outputs.node_version }}-pnpm-${{ steps.pnpm.outputs.pnpm_version }}-

      # Tests may require backend stack services to be available.
      - name: 'Wait for the API before integration tests'
        run: 'mise //docker:up-backend'

      - name: 'Install dependencies and check frontend'
        run: |
          mise //docker:run --rm --no-deps frontend-app-web --config.verify-deps-before-run=false exec sh -ec '
            pnpm install --frozen-lockfile
            for check in format:check lint typecheck test build; do
              printf "::group::%s\n" "$check"
              pnpm --filter web "$check"
              printf "::endgroup::\n"
            done
          '

      - name: 'Save frontend pnpm cache'
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm_cache.outputs.cache-hit != 'true' }}"
        uses: 'actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf' # v4.2.2
        with:
          path: |
            ${{ steps.pnpm.outputs.store_path }}
            ${{ steps.pnpm.outputs.cache_path }}
          key: "pnpm-cache-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.pnpm.outputs.node_version }}-pnpm-${{ steps.pnpm.outputs.pnpm_version }}-${{ hashFiles('frontend/pnpm-lock.yaml', 'frontend/pnpm-workspace.yaml') }}"

      - name: 'Show container diagnostics on failure'
        if: 'failure()'
        run: |
          mise exec -- bash docker/compose.sh --profile '*' ps --all
          mise exec -- bash docker/compose.sh --profile '*' logs \
            --no-color --timestamps --tail 300 backend-app-api backend-dep-postgres backend-dep-redis backend-dep-flyway

      - name: 'Clean frontend Compose stack'
        if: 'always()'
        run: 'mise //docker:down'
