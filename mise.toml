# Monorepo task paths are currently an experimental mise feature.
monorepo_root = true

[settings]
experimental = true

[monorepo]
# Automatic mise.toml discovery is deprecated, so config roots are listed explicitly.
config_roots = [
  "backend",
  "docker",
  "frontend",
  "frontend/web",
]

[env]
# Centralized major versions of important runtimes consumed by Dockerfiles and Compose files
# See docs/docker-setup-explain.md for the shared container-based development/CI environment
JDK_VERSION = "25" # keep aligned with java in backend/gradle/libs.versions.toml
PNPM_VERSION = "12"
# Downstream consumers include:
# - mise [tools] for the host JDK and pnpm installs
# - Docker Compose image tags, container environment, and build.args
# - Dockerfiles via ARG (Compose or CLI --build-arg must supply them)
# - frontend CI, which reads the values through mise exec to formulate cache keys
# - the backend Gradle included-plugin build, which overlays JDK_VERSION onto the imported catalog when present

[tools]
# We mostly use floating version unless there is a specific reason to pin the version.

# Backend
java = "{{ env.JDK_VERSION }}"

# Frontend
pnpm = "{{ env.PNPM_VERSION }}" # pnpm will manager the nodejs via devEngines.runtime

# Others
uv = "latest"
